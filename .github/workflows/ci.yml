name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libmpv
        run: brew install mpv
      # rustup installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Rustfmt
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  advisories:
    # cargo-deny-action is a container action, so it needs a Linux runner; it only reads Cargo.lock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
